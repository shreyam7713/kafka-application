name: shreyam-hackathon
services:
  kafka:
    image: shreyam-hackathon-kafka:4.1.2
    platform: linux/amd64
    container_name: shreyam-hackathon-kafka
    ports:
      - "127.0.0.1:19092:19092"
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/hackathon-kafka
      - ./config/server.properties:/etc/hackathon/server.properties:ro
volumes:
  kafka-data:
    name: shreyam-hackathon-kafka-data
